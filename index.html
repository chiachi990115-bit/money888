<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>錢錢跑去哪 - 公司及家務帳目管理</title>
<link href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg-base:#F7F4EF;--primary:#8C6D54;--secondary:#D0B8A8;--text-dark:#3B302B;--white:#FFFFFF}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Serif TC',serif;background:var(--bg-base);color:var(--text-dark);line-height:1.6;padding-bottom:50px}.rufina{font-family:'Rufina',serif}header{background:var(--white);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(140,109,84,.1)}.brand h1{font-size:24px;color:var(--primary)}.brand span{font-size:12px;color:var(--secondary)}.header-controls{display:flex;gap:10px;flex-wrap:wrap}select,button,input{font-family:inherit;padding:8px 12px;border:1px solid var(--secondary);border-radius:6px;background:var(--white);color:var(--text-dark);font-size:16px;min-height:44px}button{cursor:pointer;transition:.3s;font-weight:bold}.btn-primary{background:var(--primary);color:white;border:none}.btn-primary:hover{background:#705540}.tabs{display:flex;justify-content:center;gap:10px;margin:20px;flex-wrap:wrap}.tab-btn{background:transparent;border:2px solid var(--secondary);color:var(--text-dark)}.tab-btn.active{background:var(--secondary);color:white}.container{max-width:1000px;margin:0 auto;padding:0 20px}.tab-content{display:none;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.03)}.tab-content.active{display:block}.input-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.input-group input{flex:1;min-width:120px}.table-wrapper{overflow-x:auto;margin-bottom:20px;border-radius:8px;border:1px solid #eee}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}th{background:var(--bg-base);color:var(--primary);white-space:nowrap}.status-btn{padding:6px 12px;border-radius:20px;font-size:14px;min-height:auto}.status-claimed{background:var(--primary);color:white;border:none}.status-unclaimed{background:var(--bg-base);color:var(--secondary);border:1px solid var(--secondary)}.edit-btn{background:transparent;border:none;color:var(--primary);text-decoration:underline;padding:6px}.summary-box{font-size:20px;margin-bottom:15px;font-weight:bold}.summary-box span{font-size:28px;color:var(--primary)}#chart-container{position:relative;height:350px;width:100%;margin-bottom:30px}.hint{font-size:13px;color:#8C6D54;margin:-9px 0 15px}@media(max-width:600px){.brand h1{font-size:20px}.header-controls{flex-direction:column}header{align-items:flex-start;gap:10px}.header-controls select{max-width:150px}.container{padding:0 12px}}
</style></head><body id="app-body">
<header><div class="brand"><h1 class="rufina">錢錢跑去哪</h1><span>公司及家務帳目管理</span></div><div class="header-controls"><select id="year-select" aria-label="選擇年份" onchange="app.changePeriod()"></select><select id="month-select" aria-label="選擇月份" onchange="app.changePeriod()"></select><button class="btn-primary" onclick="app.exportPDF()">匯出資料</button></div></header>
<div class="tabs" id="main-tabs"><button class="tab-btn active" onclick="app.switchTab('main')">記帳主頁</button><button class="tab-btn" onclick="app.switchTab('search')">付款人搜尋</button><button class="tab-btn" onclick="app.switchTab('stats')">統計圖表</button></div>
<div class="container" id="pdf-content">
<div id="tab-main" class="tab-content active"><div class="tabs" style="margin-top:0"><button class="tab-btn active" id="btn-type-company" onclick="app.switchType('company')">🏢 公司帳</button><button class="tab-btn" id="btn-type-family" onclick="app.switchType('family')">🏠 家庭帳</button></div><div class="summary-box">總金額結算：<span class="rufina" id="total-amount">$0</span></div><div class="hint" id="period-hint"></div><div class="input-group"><input type="date" id="input-date"><input type="text" id="input-name" placeholder="請款名單 (自由填寫)"><input type="text" id="input-memo" placeholder="支出分類 / 備註"><input type="text" id="input-income-memo" placeholder="收入分類 / 備註"><input type="number" id="input-amount" class="rufina" placeholder="金額 ($)"><button class="btn-primary" onclick="app.addRecord()">新增項目</button></div><div class="table-wrapper"><table><thead><tr><th>日期</th><th>請款名單</th><th>支出備註</th><th>收入備註</th><th>金額</th><th>請款狀態</th><th>操作</th></tr></thead><tbody id="record-list"></tbody></table></div></div>
<div id="tab-search" class="tab-content"><div class="input-group"><input type="text" id="search-keyword" placeholder="輸入付款人姓名..." oninput="app.searchPayer()"></div><div class="summary-box">該付款人總計：<span class="rufina" id="search-total">$0</span></div><div class="table-wrapper"><table><thead><tr><th>日期</th><th>類別</th><th>支出備註</th><th>收入備註</th><th>金額</th><th>狀態</th></tr></thead><tbody id="search-list"></tbody></table></div></div>
<div id="tab-stats" class="tab-content"><div class="summary-box">年度總金流總覽</div><div id="chart-container"><canvas id="monthlyChart"></canvas></div><div class="summary-box" style="margin-top:30px">全年明細列表</div><div class="table-wrapper"><table><thead><tr><th>日期</th><th>類別</th><th>請款名單</th><th>支出備註</th><th>收入備註</th><th>金額</th><th>狀態</th></tr></thead><tbody id="stats-record-list"></tbody></table></div></div>
</div>
<script>
const app={data:[],currentTab:'main',currentType:'company',chartInstance:null,
get year(){return document.getElementById('year-select').value},get month(){return document.getElementById('month-select').value},get period(){return `${this.year}-${this.month}`},
init(){try{const saved=localStorage.getItem('moneyTrackerDB');if(saved)this.data=JSON.parse(saved)}catch(e){alert('讀取既有資料時發生問題，請先備份瀏覽器資料。')}const now=new Date(),yearSelect=document.getElementById('year-select');const years=new Set([2026,2027,now.getFullYear(),...this.data.map(r=>Number(String(r.date||'').substring(0,4)))]);for(let y=Math.min(...years);y<=Math.max(...years,now.getFullYear()+1);y++){const opt=document.createElement('option');opt.value=y;opt.textContent=y;yearSelect.append(opt)}yearSelect.value=String(now.getFullYear());const monthSelect=document.getElementById('month-select');for(let m=1;m<=12;m++){const opt=document.createElement('option');opt.value=String(m).padStart(2,'0');opt.textContent=m+'月';monthSelect.append(opt)}monthSelect.value=String(now.getMonth()+1).padStart(2,'0');this.syncDate();this.render()},
save(){localStorage.setItem('moneyTrackerDB',JSON.stringify(this.data));this.render()},changePeriod(){this.syncDate();this.render()},syncDate(){const d=document.getElementById('input-date');const today=new Date(),day=this.period===`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`?today.getDate():1;d.value=`${this.period}-${String(day).padStart(2,'0')}`},
switchTab(tabId){this.currentTab=tabId;document.querySelectorAll('.tab-content').forEach(el=>el.classList.toggle('active',el.id===`tab-${tabId}`));document.querySelectorAll('#main-tabs > .tab-btn').forEach((el,i)=>el.classList.toggle('active',['main','search','stats'][i]===tabId));this.render()},switchType(type){this.currentType=type;document.getElementById('btn-type-company').classList.toggle('active',type==='company');document.getElementById('btn-type-family').classList.toggle('active',type==='family');this.render()},
addRecord(){const date=document.getElementById('input-date').value,name=document.getElementById('input-name').value.trim(),memo=document.getElementById('input-memo').value.trim(),incomeMemo=document.getElementById('input-income-memo').value.trim(),amount=parseInt(document.getElementById('input-amount').value,10);if(!date||!name||isNaN(amount))return alert('請填寫完整資訊（日期、請款名單、金額為必填）！');if(!date.startsWith(this.period+'-'))return alert('記帳日期與目前選擇的月份不同，請先切換月份或更改日期。');this.data.push({id:Date.now()+Math.floor(Math.random()*1000),year:date.substring(0,4),type:this.currentType,date,name,memo,incomeMemo,amount,claimed:false});['input-name','input-memo','input-income-memo','input-amount'].forEach(id=>document.getElementById(id).value='');this.save()},
toggleClaim(id){const r=this.data.find(x=>x.id===id);if(r){r.claimed=!r.claimed;this.save()}},editRecord(id){const r=this.data.find(x=>x.id===id);if(!r)return;const date=prompt('修改日期 (格式 YYYY-MM-DD)：',r.date);if(date===null)return;const typeInput=prompt('修改項目歸屬類型 (請輸入 company 代表公司 或 family 代表家庭)：',r.type);if(typeInput===null)return;const type=typeInput.trim().toLowerCase();if(!['company','family'].includes(type))return alert('類型輸入錯誤，僅能輸入 company 或 family，修改已取消。');const memo=prompt('修改支出分類 / 備註：',r.memo||'');if(memo===null)return;const incomeMemo=prompt('修改收入分類 / 備註：',r.incomeMemo||'');if(incomeMemo===null)return;const amount=prompt('修改金額：',r.amount);if(amount===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date.trim())||isNaN(amount)||!date.trim()||!Number.isFinite(Date.parse(date.trim())))return alert('輸入格式有誤，修改未生效。');Object.assign(r,{date:date.trim(),year:date.trim().substring(0,4),type,memo:memo.trim(),incomeMemo:incomeMemo.trim(),amount:parseInt(amount,10)});this.save()},
escape(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))},money(n){return '$'+Number(n).toLocaleString('en-US')},recordsForMonth(type){return this.data.filter(r=>String(r.date||'').startsWith(this.period+'-')&&(!type||r.type===type))},
render(){const list=document.getElementById('record-list');const rows=this.recordsForMonth(this.currentType).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('period-hint').textContent=`${this.year} 年 ${parseInt(this.month)} 月・${this.currentType==='company'?'公司帳':'家庭帳'}（獨立月份明細）`;document.getElementById('total-amount').textContent=this.money(rows.reduce((sum,r)=>sum+Number(r.amount),0));list.innerHTML=rows.map(r=>`<tr><td class="rufina">${this.escape(r.date.substring(5))}</td><td>${this.escape(r.name)}</td><td>${this.escape(r.memo||'-')}</td><td>${this.escape(r.incomeMemo||'-')}</td><td class="rufina">${this.money(r.amount)}</td><td><button class="status-btn ${r.claimed?'status-claimed':'status-unclaimed'}" onclick="app.toggleClaim(${Number(r.id)})">${r.claimed?'已請款':'未請款'}</button></td><td><button class="edit-btn" onclick="app.editRecord(${Number(r.id)})">編輯</button></td></tr>`).join('');if(this.currentTab==='search')this.searchPayer();if(this.currentTab==='stats'){this.renderChart();this.renderStatsTable()}},
searchPayer(){const keyword=document.getElementById('search-keyword').value.trim().toLowerCase(),list=document.getElementById('search-list');if(!keyword){list.innerHTML='';document.getElementById('search-total').textContent='$0';return}const rows=this.recordsForMonth().filter(r=>String(r.name||'').toLowerCase().includes(keyword));document.getElementById('search-total').textContent=this.money(rows.reduce((s,r)=>s+Number(r.amount),0));list.innerHTML=rows.map(r=>`<tr><td>${this.escape(r.date.substring(5))}</td><td>${r.type==='company'?'🏢 公司':'🏠 家庭'}</td><td>${this.escape(r.memo||'-')}</td><td>${this.escape(r.incomeMemo||'-')}</td><td>${this.money(r.amount)}</td><td>${r.claimed?'已請款':'未請款'}</td></tr>`).join('')},
renderChart(){if(typeof Chart==='undefined')return;const company=Array(12).fill(0),family=Array(12).fill(0);this.data.filter(r=>String(r.date||'').startsWith(this.year+'-')).forEach(r=>{const m=Number(r.date.substring(5,7))-1;if(m>=0&&m<12)(r.type==='company'?company:family)[m]+=Number(r.amount)});if(this.chartInstance)this.chartInstance.destroy();this.chartInstance=new Chart(document.getElementById('monthlyChart').getContext('2d'),{type:'bar',data:{labels:Array.from({length:12},(_,i)=>`${i+1}月`),datasets:[{label:'🏢 公司金額',data:company,backgroundColor:'#8C6D54'},{label:'🏠 家庭金額',data:family,backgroundColor:'#D0B8A8'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'Noto Serif TC'}}}},scales:{y:{beginAtZero:true,ticks:{font:{family:'Rufina'}}}}}})},
renderStatsTable(){const rows=this.data.filter(r=>String(r.date||'').startsWith(this.year+'-')).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('stats-record-list').innerHTML=rows.map(r=>`<tr><td>${this.escape(r.date.substring(5))}</td><td>${r.type==='company'?'🏢 公司':'🏠 家庭'}</td><td>${this.escape(r.name)}</td><td>${this.escape(r.memo||'-')}</td><td>${this.escape(r.incomeMemo||'-')}</td><td>${this.money(r.amount)}</td><td>${r.claimed?'已請款':'未請款'}</td></tr>`).join('')},
async exportPDF(){const rows=this.recordsForMonth(this.currentType).sort((a,b)=>a.date.localeCompare(b.date));if(!rows.length)return alert('此月份沒有帳目資料，請先確認月份或新增紀錄。');if(typeof html2pdf==='undefined')return alert('PDF 功能尚未載入，請確認網路連線後重試。');const name=this.currentType==='company'?'公司帳':'家庭帳',root=document.createElement('div');root.style.cssText="position:fixed;left:-10000px;top:0;width:1000px;background:#fff;color:#3B302B;padding:28px;font-family:'Noto Serif TC',serif";const total=rows.reduce((s,r)=>s+Number(r.amount),0),count=rows.filter(r=>r.claimed).length;root.innerHTML=`<h1 style="color:#8C6D54;font-size:26px;margin-bottom:8px">錢錢跑去哪｜每月帳目報表</h1><p style="font-size:18px;margin-bottom:12px">${this.year} 年 ${parseInt(this.month)} 月　${name}</p><p style="margin-bottom:16px">本月合計：<strong>${this.money(total)}</strong>　｜　共 ${rows.length} 筆　｜　已請款 ${count} 筆／未請款 ${rows.length-count} 筆</p><table style="width:100%;min-width:0;border-collapse:collapse;font-size:12px"><thead><tr><th>日期</th><th>請款名單</th><th>支出備註</th><th>收入備註</th><th>金額</th><th>請款狀態</th></tr></thead><tbody>${rows.map(r=>`<tr style="break-inside:avoid"><td>${this.escape(r.date)}</td><td>${this.escape(r.name)}</td><td>${this.escape(r.memo||'-')}</td><td>${this.escape(r.incomeMemo||'-')}</td><td style="white-space:nowrap">${this.money(r.amount)}</td><td>${r.claimed?'已請款':'未請款'}</td></tr>`).join('')}</tbody></table><p style="margin-top:18px;text-align:right;font-weight:bold">合計：${this.money(total)}</p>`;document.body.append(root);try{await document.fonts.ready;await html2pdf().set({margin:10,filename:`錢錢跑去哪_${this.year}年${this.month}月_${name}.pdf`,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,backgroundColor:'#ffffff',scrollY:0},pagebreak:{mode:['css','legacy']},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}}).from(root).save()}catch(e){console.error(e);alert('匯出失敗，請確認瀏覽器允許下載後重試。')}finally{root.remove()}}
};window.onload=()=>app.init();
</script></body></html>
